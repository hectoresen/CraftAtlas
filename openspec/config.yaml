schema: spec-driven
context: |
  CraftAtlas is a working, offline, native-Lua World of Warcraft: Forever addon.
  Current implemented features, commands and supported limits are documented in README.md.
  Do not duplicate feature/version status here or infer completeness from the roadmap.
  Materials use numeric itemID identity; recipes use professionKey + spellID.
  Client item/spell names and rarity may be unavailable; never invent them.
  Source-backed catalog data is from a pinned, attributed beta dataset, not a
  claim of complete current live-realm coverage.
  Lua domain code stays independent of WoW APIs; client adapters live in Infrastructure.
  UI components are shared where possible; user-facing strings are enUS/esES.
  Local offline runtime: no mandatory external addon, network service or telemetry.
  Before opening functional PRs explicitly run skills/documentation-sync/SKILL.md;
  distinguish implemented code, maintainer-reported game checks and data verification.
  Read AGENTS.md, README.md, docs/ARCHITECTURE.md, docs/DATA_MODEL.md,
  docs/TESTING.md and docs/SDD_COMPLIANCE.md before proposing a change.
rules:
  proposal:
    - Define why, in/out scope, target milestone, risks and rollback.
    - Identify compatibility assumptions, data sources and licenses.
    - Keep governance changes scoped and approved by the owner before implementation.
  specs:
    - Write testable SHALL requirements and WHEN/THEN scenarios.
    - Distinguish implemented functionality from future and unverified behaviors.
    - Include unknown material, multiple professions and locale fallback cases.
  design:
    - Document module boundaries, game API verification and performance.
    - Specify data provenance, error handling and reusable UI contracts.
  tasks:
    - Include automated tests, in-game verification, documentation and localization.
    - Run documentation-sync before implementation PR creation and record evidence.
    - Keep tasks individually verifiable; do not check unrun game tests.
