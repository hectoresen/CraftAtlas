name: Bug report
description: Report incorrect CraftAtlas behavior
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Expected and actual behavior; include exact itemIDs when relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CraftAtlas and Forever client versions
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction and Lua errors
